<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elastic rope</title>
    <style>
        body {
            background-image: url('./space.jpg');
            background-size: cover;
        }
        #box {
            width: 90px;
            height: 90px;
        }
        #box svg {
            rotate: 70deg;
        }
        .rotate {
            animation: spin 2s infinite linear;
        }
        @keyframes spin {
            0% {
                rotate: 0deg;
            }
            100% {
                rotate: 360deg;
            }
        }
    </style>
</head>
<body>
<div id="box" class="rotate">
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" width="150%" height="150%">
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComponentTransfer in="blur" result="glow1">
        <feFuncA type="linear" slope="2" />
      </feComponentTransfer>
      <feMerge>
        <feMergeNode in="glow1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="drop-shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="15" dy="15" stdDeviation="10" flood-color="#000" flood-opacity="0.6"/>
    </filter>

    <linearGradient id="metal-face" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8a95a5" />
      <stop offset="50%" stop-color="#4a5568" />
      <stop offset="100%" stop-color="#2d3748" />
    </linearGradient>

    <linearGradient id="bevel-top" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#cbd5e0" />
      <stop offset="100%" stop-color="#718096" />
    </linearGradient>

    <linearGradient id="bevel-bottom" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2d3748" />
      <stop offset="100%" stop-color="#1a202c" />
    </linearGradient>

    <linearGradient id="bevel-left" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a0aec0" />
      <stop offset="100%" stop-color="#4a5568" />
    </linearGradient>

    <linearGradient id="bevel-right" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4a5568" />
      <stop offset="100%" stop-color="#2d3748" />
    </linearGradient>

    <linearGradient id="leather" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#111" />
      <stop offset="25%" stop-color="#333" />
      <stop offset="50%" stop-color="#0a0a0a" />
      <stop offset="75%" stop-color="#222" />
      <stop offset="100%" stop-color="#000" />
    </linearGradient>

    <linearGradient id="silver" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e2e8f0" />
      <stop offset="50%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#718096" />
    </linearGradient>

    <pattern id="engraving" x="0" y="0" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 0 12 C 6 0, 18 24, 24 12 C 18 0, 6 24, 0 12" stroke="#b08d55" fill="none" stroke-width="1.5" opacity="0.6"/>
      <path d="M 12 0 C 24 6, 0 18, 12 24 C 0 18, 24 6, 12 0" stroke="#b08d55" fill="none" stroke-width="1.5" opacity="0.6"/>
      <circle cx="12" cy="12" r="3" stroke="#b08d55" fill="none" stroke-width="1" opacity="0.4"/>
    </pattern>
  </defs>

  <g filter="url(#drop-shadow)">
    
    <rect x="210" y="135" width="240" height="30" fill="url(#leather)" />
    
    <g stroke="url(#silver)" stroke-width="3.5" fill="none" stroke-linecap="round">
      <path d="M 215 135 Q 225 150 215 165" />
      <path d="M 240 135 Q 250 150 240 165" />
      <path d="M 265 135 Q 275 150 265 165" />
      <path d="M 290 135 Q 300 150 290 165" />
      <path d="M 315 135 Q 325 150 315 165" />
      <path d="M 340 135 Q 350 150 340 165" />
      <path d="M 365 135 Q 375 150 365 165" />
      <path d="M 390 135 Q 400 150 390 165" />
      <path d="M 415 135 Q 425 150 415 165" />
      <path d="M 440 135 Q 450 150 440 165" />
    </g>

    <rect x="445" y="131" width="35" height="38" rx="4" fill="url(#silver)" />
    <rect x="450" y="131" width="5" height="38" fill="#4a5568" opacity="0.3"/>
    <rect x="470" y="131" width="5" height="38" fill="#cbd5e0" opacity="0.6"/>
    
    <path d="M 480 150 L 495 150" stroke="#718096" stroke-width="5" fill="none" stroke-linecap="round"/>
    <path d="M 490 150 C 510 110, 560 130, 550 160 C 540 190, 500 180, 490 150" stroke="#a0522d" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 492 150 C 508 118, 552 135, 545 160" stroke="#cd853f" stroke-width="1.5" fill="none"/>

    <polygon points="50,85 70,70 70,230 50,215" fill="url(#bevel-left)" />
    
    <polygon points="190,70 210,85 210,215 190,230" fill="url(#bevel-right)" />

    <polygon points="85,50 175,50 190,70 70,70" fill="url(#bevel-top)" />
    <polygon points="85,50 175,50 190,70 70,70" fill="url(#engraving)" />

    <polygon points="70,230 190,230 175,250 85,250" fill="url(#bevel-bottom)" />
    <polygon points="70,230 190,230 175,250 85,250" fill="url(#engraving)" />

    <polygon points="50,85 85,50 70,70" fill="#8a95a5" />
    <polygon points="175,50 210,85 190,70" fill="#718096" />
    <polygon points="50,215 70,230 85,250" fill="#4a5568" />
    <polygon points="190,230 210,215 175,250" fill="#2d3748" />

    <polygon points="70,70 190,70 190,230 70,230" fill="url(#metal-face)" />

    <g stroke="#ffffff" stroke-width="0.5" opacity="0.15" fill="none">
      <line x1="80" y1="90" x2="120" y2="130" />
      <line x1="150" y1="80" x2="170" y2="100" />
      <line x1="90" y1="200" x2="130" y2="180" />
      <line x1="160" y1="210" x2="180" y2="190" />
      <line x1="100" y1="150" x2="140" y2="150" />
    </g>

    <g filter="url(#glow)" stroke="#c4d2ff" fill="none" stroke-linejoin="miter" stroke-linecap="round">
      
      <path d="M 60 75 L 80 110 L 75 130 L 110 160 L 95 180 L 130 215 L 125 240" stroke-width="2.5" stroke="#ffffff"/>
      <path d="M 60 75 L 80 110 L 75 130 L 110 160 L 95 180 L 130 215 L 125 240" stroke-width="6" stroke="#8a2be2" opacity="0.6"/>
      
      <path d="M 80 110 L 110 105 L 120 120" stroke-width="1.5" stroke="#ffffff" />
      <path d="M 110 160 L 140 150 L 160 170" stroke-width="1.5" stroke="#ffffff" />
      <path d="M 130 215 L 160 210 L 180 235" stroke-width="1.5" stroke="#ffffff" />

      <path d="M 160 60 L 175 90 L 165 110 L 195 140 L 175 170 L 195 200" stroke-width="2" stroke="#ffffff"/>
      <path d="M 160 60 L 175 90 L 165 110 L 195 140 L 175 170 L 195 200" stroke-width="5" stroke="#4169e1" opacity="0.6"/>
      
      <path d="M 175 90 L 150 95 L 145 115" stroke-width="1" stroke="#ffffff" />
      <path d="M 195 140 L 160 145 L 155 165" stroke-width="1" stroke="#ffffff" />
      
      <path d="M 120 120 L 130 135 L 150 130" stroke-width="0.8" stroke="#e0eaff" opacity="0.8"/>
      <path d="M 160 170 L 145 185 L 150 200" stroke-width="0.8" stroke="#e0eaff" opacity="0.8"/>
    </g>

  </g>
</svg>

</div>
</body>
<script src="script.js"></script>
</html>
