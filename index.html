<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elastic rope</title>
    <style>
        body {
            background-image: url('./space.jpg');
            background-size: cover;
        }
        #box {
            width: 90px;
            height: 90px;
        }
        #box svg {
            rotate: -20deg;
        }
        .rotate {
            animation: spin 2s infinite linear;
        }
        @keyframes spin {
            0% {
                rotate: 0deg;
            }
            100% {
                rotate: 360deg;
            }
        }
    </style>
</head>
<body>
    <div id="box" class="rotate">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <clipPath id="handle-clip">
      <rect x="225" y="190" width="50" height="240" />
    </clipPath>
  </defs>

  <g clip-path="url(#handle-clip)">
    <rect x="225" y="190" width="50" height="240" fill="#344652" />
    
    <polygon points="225,190 275,240 275,275 225,225" fill="#f19e38" />
    <polygon points="225,260 275,310 275,345 225,295" fill="#f19e38" />
    <polygon points="225,330 275,380 275,415 225,365" fill="#f19e38" />
    <polygon points="225,400 275,450 275,485 225,435" fill="#f19e38" />
  </g>

  <path d="M 210 430 L 250 430 L 250 470 L 216 470 A 6 6 0 0 1 210 464 Z" fill="#eea141" />
  <path d="M 250 430 L 290 430 L 290 464 A 6 6 0 0 1 284 470 L 250 470 Z" fill="#ce8325" />

  <rect x="150" y="75" width="35" height="100" fill="#96a5b1" />
  <rect x="315" y="75" width="35" height="100" fill="#96a5b1" />

  <polygon points="150,75 110,75 90,95 90,155 110,175 150,175" fill="#e0e6eb" />
  
  <polygon points="350,75 390,75 410,95 410,155 390,175 350,175" fill="#b9c5ce" />

  <rect x="185" y="60" width="65" height="130" fill="#e0e6eb" />
  
  <rect x="250" y="60" width="65" height="130" fill="#b9c5ce" />
</svg>

</div>
</body>
<script src="script.js"></script>
</html>
